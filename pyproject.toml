[tool.ruff]
target-version = "py312"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/memriver-core/tests", "packages/memriver/tests"]
addopts = "--import-mode=importlib"
