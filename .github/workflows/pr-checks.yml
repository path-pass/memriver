name: pr-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: git --version
      - run: uv sync --locked
      - run: uv run pytest -q

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: bash e2e/run-stage1.sh

  # The two jobs below run only for a change they depend on: rust for the Rust
  # workspace, the cross-implementation suite or the rule files both
  # implementations embed; compat for those and for the Python side as well.
  rust-changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      compat: ${{ steps.filter.outputs.compat }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/rust-paths-changed.sh "$BASE" >> "$GITHUB_OUTPUT"

  rust:
    name: rust (${{ matrix.os }})
    needs: rust-changes
    if: needs.rust-changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain rust-toolchain.toml names
        run: >
          rustup toolchain install
          "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target/
          key: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  compat:
    name: compat (${{ matrix.os }})
    needs: rust-changes
    if: needs.rust-changes.outputs.compat == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install the toolchain rust-toolchain.toml names
        run: >
          rustup toolchain install
          "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target/
          key: compat-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: git --version
      - run: uv sync --locked
      - run: cargo build --release
      - run: uv run pytest compat -q
