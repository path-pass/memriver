[project]
name = "memriver"
version = "0.1.0"
description = "Shared memory layer for coding agents across harnesses, exposed via MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "path-pass" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "memriver-core==0.1.0",
    "memriver-dream==0.1.0",
    "fastmcp>=3.4.7,<4",
    "pydantic>=2",
    "tomlkit",
]

[project.scripts]
memriver = "memriver.cli:main"

[project.optional-dependencies]
# planned: vector = ["memriver-vector"], sync = ["memriver-sync"]
classifier = ["memriver-classifier==0.1.0"]

[project.urls]
Homepage = "https://github.com/path-pass/memriver"
Repository = "https://github.com/path-pass/memriver"
Issues = "https://github.com/path-pass/memriver/issues"

[tool.uv.sources]
memriver-core = { workspace = true }
memriver-dream = { workspace = true }
memriver-classifier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
