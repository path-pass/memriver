[project]
name = "memriver-dream"
version = "0.1.0"
description = "memriver dream: offline session summaries, memory consolidation and TTL retirement"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "path-pass" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# harness-neutral by rule: no LLM client, no harness, and no third-party dependency
# beyond the pydantic/pydantic-settings baseline core already brings (the settings
# module reads the [dream] table with them directly)
dependencies = [
    "memriver-core>=0.1.0",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.urls]
Homepage = "https://github.com/path-pass/memriver"
Repository = "https://github.com/path-pass/memriver"
Issues = "https://github.com/path-pass/memriver/issues"

[tool.uv.sources]
memriver-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
